<div id="Glyph">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="left">
			<button
				class="base"
				data-background="basic_interface/sys_base_off.bmp"
				data-hover="basic_interface/sys_base_on.bmp"
			></button>
			<span class="text">雕文</span>
		</div>
		<div class="right">
			<button
				class="base close"
				data-background="basic_interface/sys_close_off.bmp"
				data-hover="basic_interface/sys_close_on.bmp"
			></button>
		</div>
		<div class="clear"></div>
	</div>
	<div class="content">
		<div class="glyph-board">
			<div class="emblem"><span>雕</span></div>
			<div class="slot major" data-ring="major"></div>
			<div class="slot major" data-ring="major"></div>
			<div class="slot major" data-ring="major"></div>
			<div class="slot minor" data-ring="minor"></div>
			<div class="slot minor" data-ring="minor"></div>
			<div class="slot minor" data-ring="minor"></div>
			<div class="slot minor" data-ring="minor"></div>
			<div class="slot minor" data-ring="minor"></div>
		</div>
		<div class="footer">
			<span class="count">大雕文 <span class="major-count">0</span>/3</span>
			<span class="count">小雕文 <span class="minor-count">0</span>/5</span>
		</div>
	</div>
</div>
